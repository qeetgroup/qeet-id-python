name: Release

# Run by hand from main (Actions > Release > Run workflow), choosing the part of
# the version to bump. Merging into main never publishes by itself: the version
# is decided when a release is run, not by whichever merge came last.
#
# PyPI trusted publishing: no API token is stored. On PyPI, the project's
# trusted publisher must name this repository, this workflow file (release.yml)
# and the "pypi" environment.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history to find the latest tag
          persist-credentials: false

      - name: Determine next version
        id: version
        env:
          # `type: choice` constrains this server-side, but keep it out of the
          # script body anyway so the run block never interpolates input.
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            *)     new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Latest: $latest  ->  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"

      # PyPI publishes the version in pyproject.toml, not the git tag, so the
      # two have to agree. Set it before the gate so the built artifacts carry
      # it; the change is committed only once the publish succeeds.
      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: uv version "${VERSION#v}"

      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python scripts/unasync.py --check
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - run: uv run --locked python scripts/check_wheel.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qeet-id/
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations; nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: Tag the release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump and tag after a successful publish
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"

      # Commit and tag AFTER a successful publish so every tag is a version that
      # is live on PyPI. This push uses GITHUB_TOKEN, which by design doesn't
      # trigger workflows, so it can't loop back into this one.
      - name: Commit version bump, tag and create GitHub release
        env:
          VERSION: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv version "${VERSION#v}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "$VERSION"
          git push origin HEAD:main --follow-tags
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${{ github.repository }}"
