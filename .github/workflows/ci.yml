name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every maintained Python (pyproject.toml requires >=3.11). Drop one when it reaches end of life.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}

      - run: uv sync --locked
      - run: uv run --locked pytest --cov --cov-report=term-missing --cov-fail-under=95

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"

      - run: uv sync --locked
      - run: uv build
      # The metadata PyPI renders, and the wheel holds the package, py.typed and nothing else.
      - run: uvx twine==7.0.0 check --strict dist/*
      - run: uv run --locked python scripts/check_wheel.py dist
